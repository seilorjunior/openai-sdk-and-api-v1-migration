name: Migration validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest with coverage
        run: >-
          python -m pytest
          --cov=smoke_test
          --cov=capability_test
          --cov=compare_responses
          --cov=load_test
          --cov=migration_scan
          --cov=retirement_report
          --cov=validate_apim
          --cov-report=term-missing
          --cov-fail-under=60
      - name: Generate migration scan evidence
        if: ${{ matrix.python-version == '3.13' }}
        run: python migration_scan.py . --format sarif --output migration-scan.sarif
      - name: Upload migration scan evidence
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-scan
          path: migration-scan.sarif
          if-no-files-found: error
      - name: Ruff lint
        run: python -m ruff check .
      - name: mypy
        run: python -m mypy
      - name: Dependency vulnerability audit
        if: ${{ matrix.python-version == '3.13' }}
        run: python -m pip_audit -r requirements.txt

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --outfile /tmp/main.json
      - run: az bicep lint --file infra/main.bicep
      - run: az bicep lint --file infra/resources.bicep
      - name: Parse generated and parameter ARM JSON
        shell: pwsh
        run: |
          Get-Content /tmp/main.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content infra/main.parameters.json -Raw | ConvertFrom-Json | Out-Null
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell scripts
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path scripts -Recurse -EnableExit
