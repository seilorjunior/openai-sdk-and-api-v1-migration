name: Migration validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Ruff lint
        run: ruff check .
      - name: mypy (informational; known pre-existing gaps are not yet a merge gate)
        run: mypy || true

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --outfile /tmp/main.json
      - run: az bicep lint --file infra/main.bicep
      - run: az bicep lint --file infra/resources.bicep
